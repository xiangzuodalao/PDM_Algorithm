[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "valeo-pdm"
version = "0.1.0"
description = "Predictive maintenance time-series forecasting (Informer/Autoformer) with training and FastAPI service."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "pyyaml>=6.0",
  "tqdm>=4.66",
  "torch",
  "fastapi>=0.104",
  "pydantic>=2",
  "uvicorn[standard]>=0.24",
  "psycopg2-binary>=2.9",
  "matplotlib>=3.8",
  "ruff>=0.6",
  "pytest>=8",
  "pyodbc>=5.3.0",
]

[project.scripts]
valeo-pdm = "valeo_pdm.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.ruff]
line-length = 100
target-version = "py311"
