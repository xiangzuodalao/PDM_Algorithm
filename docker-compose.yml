services:
  valeo-pdm-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: valeo-pdm:latest
    ports:
      # host_port:container_port
      - "127.0.0.1:${VALEO_PDM_HTTP_PORT:-10021}:10021"
    ipc: host
    extra_hosts:
      # Linux server: make host reachable from container via host.docker.internal
      - "host.docker.internal:host-gateway"
    environment:
      # Mount your real DB config and point to it
      VALEO_PDM_POSTGRES_CONFIG: /app/configs/postgres_config.json
      # 兼容现有数字化平台；MCP 始终携带训练计划哈希
      VALEO_PDM_REQUIRE_TRAIN_PLAN_HASH: "${VALEO_PDM_REQUIRE_TRAIN_PLAN_HASH:-0}"
      # Optional: override model registry path
      # VALEO_PDM_MODEL_REGISTRY: /app/configs/model_registry.yaml
    volumes:
      # runtime configs (do not bake secrets into image)
      - ./configs:/app/configs:ro
      # - ./configs/model_registry.yaml:/app/configs/model_registry.yaml:ro
      # - ./configs/postgres_config.json:/app/configs/postgres_config.json:ro
      # artifacts & data persistence
      - ./artifacts:/app/artifacts
      - ./data:/app/data
      - ./src:/app/src
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:10021/healthz').read()"]
      interval: 30s
      timeout: 3s
      retries: 3
