      train_params:
        seq_len: 672          # 7天历史（15min粒度，每天96点）
        label_len: 168        # decoder 1.75天历史
        pred_len: 672         # 7天预测
        stride: 4             # 1小时滑窗步长，增加样本数
        batch_size: 16
        epochs: 50
        lr: 0.0005
        d_model: 128          # 小数据集，缩小模型容量
        n_heads: 4
        d_ff: 256
        dropout: 0.1
        e_layers: 2
        d_layers: 2
