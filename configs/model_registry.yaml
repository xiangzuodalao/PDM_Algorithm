# 模型注册配置文件
# 管理所有设备-参数-模型的映射关系

models:
  # ==================== V-SZ-ISD-102 设备 ====================
  V-SZ-ISD-102:
    CCD-Score1:
      model_type: informer          # 模型类型: informer, testmodel, autoformer
      freq: "15min"
      days_back: 365
      source: db                    # 数据源: db, csv
      # 训练参数（用于重新训练时参考）
      train_params:
        seq_len: 1344
        label_len: 336
        pred_len: 672
        batch_size: 32
        epochs: 100
        lr: 0.0005
        d_model: 256
        n_heads: 8
        d_ff: 512
        dropout: 0.05
        e_layers: 3
        d_layers: 2
        attn_type: prob
        distil: true
        patience: 15
        lr_factor: 0.8
        lr_patience: 8
        weight_decay: 0
        grad_clip: 0.5

