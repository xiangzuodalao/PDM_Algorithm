[project]
name = "pdm-mcp"
version = "0.1.0"
description = "面向 Codex 的 Valeo PdM Algorithm MCP Server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1,<1",
    "mcp[cli]>=1.28,<2",
    "pydantic>=2.12,<3",
]

[project.scripts]
pdm-mcp = "pdm_mcp.server:main"
pdm-mcp-http = "pdm_mcp.server:http_main"

[build-system]
requires = ["uv_build>=0.11.30,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.2,<2",
    "ruff>=0.14,<1",
]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
