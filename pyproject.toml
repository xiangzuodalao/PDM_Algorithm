[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ifactorymom-pdm-algorithm"
version = "0.1.0"
description = "Predictive maintenance time-series forecasting (Informer/Autoformer) with training and FastAPI service."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "celery[redis]==5.6.3",
    "fastapi==0.125.0",
    "filelock==3.25.2",
    "httpx==0.28.1",
    "matplotlib==3.10.8",
    "numpy==2.3.5",
    "pandas==2.3.3",
    "psycopg2-binary==2.9.11",
    "pydantic==2.12.5",
    "pyodbc==5.3.0",
    "pyyaml==6.0.3",
    "requests==2.32.5",
    "rfc8785==0.1.4",
    "starlette==0.50.0",
    "torch==2.10.0",
    "tqdm==4.67.1",
    "urllib3==2.6.3",
    "uvicorn==0.38.0",
]

[dependency-groups]
dev = [
    "pytest==9.0.2",
    "ruff==0.14.9",
]

[project.scripts]
valeo-pdm = "valeo_pdm.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration_db: explicitly authorized read-only real database integration test",
]
addopts = "-m 'not integration_db'"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
